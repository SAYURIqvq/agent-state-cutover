<div id="agent-diagram">
  <style>
    #agent-diagram {
      --bg: #f8f5ee;
      --ink: #17201e;
      --muted: #66706c;
      --line: #5f6b66;
      --panel: #fffdf8;
      --agent: #315f8f;
      --state: #17705c;
      --patch: #a84a55;
      --archive: #5b519b;
      --note: #8e651e;
      --cut: #286e86;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid #ded8ca;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0 auto;
      max-width: 1080px;
      padding: 24px;
    }

    #agent-diagram * {
      box-sizing: border-box;
    }

    #agent-diagram .header {
      border-bottom: 1px solid #ded8ca;
      margin-bottom: 22px;
      padding-bottom: 16px;
    }

    #agent-diagram h1 {
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0;
      margin: 0 0 8px;
    }

    #agent-diagram .lead {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 0;
      max-width: 860px;
    }

    #agent-diagram .canvas {
      background: var(--panel);
      border: 1px solid #ded8ca;
      padding: 24px 18px;
      overflow: auto;
    }

    #agent-diagram svg {
      display: block;
      height: auto;
      margin: 0 auto;
      max-width: 100%;
    }

    #agent-diagram .node rect,
    #agent-diagram .node polygon {
      fill: #ffffff;
      stroke: var(--c);
      stroke-width: 2.5;
    }

    #agent-diagram .node text {
      text-anchor: middle;
    }

    #agent-diagram .zh {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 750;
    }

    #agent-diagram .en {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    #agent-diagram .small {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    #agent-diagram .arrow {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.2;
    }

    #agent-diagram .arrow.patch {
      stroke: var(--patch);
    }

    #agent-diagram .arrow.archive {
      stroke: var(--archive);
    }

    #agent-diagram .arrow.cut {
      stroke: var(--cut);
    }

    #agent-diagram .label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
    }

    #agent-diagram .section-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 800;
      text-anchor: middle;
    }

    #agent-diagram .note-box {
      fill: #fff8e6;
      stroke: var(--note);
      stroke-width: 2;
    }

    #agent-diagram .legend {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    #agent-diagram .legend div {
      background: var(--panel);
      border: 1px solid #ded8ca;
      border-left: 4px solid var(--c);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      padding: 10px;
    }

    #agent-diagram .legend strong {
      color: var(--ink);
      display: block;
      margin-bottom: 3px;
    }

    @media (max-width: 720px) {
      #agent-diagram {
        padding: 14px;
      }

      #agent-diagram .canvas {
        padding: 16px 10px;
      }

      #agent-diagram .legend {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <div class="header">
    <h1>长程 Agent 硬切上下文架构</h1>
    <p class="lead">这版按你笔记里的图来画：上半部分是 Agent 每一轮怎么从状态投影开始执行，并把结果写回 State 和 Archive；下半部分是 Context 快满后，旧窗口如何生成 Checkpoint，再切到新窗口继续。</p>
  </div>

  <div class="canvas">
    <svg viewBox="0 0 920 1280" role="img" aria-label="长程 Agent 的硬切上下文架构图">
      <defs>
        <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#5f6b66"></path>
        </marker>
        <marker id="arrow-patch" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#a84a55"></path>
        </marker>
        <marker id="arrow-archive" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#5b519b"></path>
        </marker>
        <marker id="arrow-cut" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
          <path d="M 1 1 L 11 6 L 1 11 z" fill="#286e86"></path>
        </marker>
      </defs>

      <text class="section-title" x="460" y="34">一、正常执行循环 / Normal Agent Loop</text>

      <g class="node" style="--c: var(--agent)" transform="translate(330 62)">
        <rect width="260" height="72"></rect>
        <text class="zh" x="130" y="30">用户任务</text>
        <text class="en" x="130" y="52">User Task</text>
      </g>
      <path class="arrow" d="M 460 134 V 174" marker-end="url(#arrow)"></path>

      <g class="node" style="--c: var(--agent)" transform="translate(330 174)">
        <rect width="260" height="84"></rect>
        <text class="zh" x="130" y="34">当前 Agent</text>
        <text class="en" x="130" y="58">Current Agent</text>
      </g>
      <path class="arrow" d="M 460 258 V 302" marker-end="url(#arrow)"></path>
      <text class="label" x="460" y="286">状态投影 / State Projection</text>

      <g class="node" style="--c: var(--state)" transform="translate(330 302)">
        <rect width="260" height="84"></rect>
        <text class="zh" x="130" y="34">当前最小状态</text>
        <text class="en" x="130" y="58">Minimal Current State</text>
      </g>
      <path class="arrow" d="M 460 386 V 428" marker-end="url(#arrow)"></path>

      <g class="node" style="--c: var(--agent)" transform="translate(360 428)">
        <rect width="200" height="72"></rect>
        <text class="zh" x="100" y="30">LLM</text>
        <text class="en" x="100" y="52">Reasoning Model</text>
      </g>
      <path class="arrow" d="M 460 500 V 548" marker-end="url(#arrow)"></path>
      <text class="label" x="460" y="528">推理 + 工具调用 / Reason + Tool Call</text>

      <path class="arrow" d="M 460 548 V 594"></path>
      <path class="arrow" d="M 460 594 H 250 V 634" marker-end="url(#arrow)"></path>
      <path class="arrow patch" d="M 460 594 H 670 V 634" marker-end="url(#arrow-patch)"></path>

      <g class="node" style="--c: var(--agent)" transform="translate(120 634)">
        <rect width="260" height="84"></rect>
        <text class="zh" x="130" y="34">工具结果</text>
        <text class="en" x="130" y="58">Tool Result</text>
      </g>

      <g class="node" style="--c: var(--patch)" transform="translate(540 634)">
        <rect width="260" height="84"></rect>
        <text class="zh" x="130" y="34">状态补丁</text>
        <text class="en" x="130" y="58">State Patch</text>
      </g>

      <path class="arrow patch" d="M 670 718 V 770" marker-end="url(#arrow-patch)"></path>
      <g class="node" style="--c: var(--patch)" transform="translate(540 770)">
        <rect width="260" height="84"></rect>
        <text class="zh" x="130" y="34">结构校验</text>
        <text class="en" x="130" y="58">Schema Validation</text>
      </g>

      <path class="arrow patch" d="M 670 854 V 906" marker-end="url(#arrow-patch)"></path>
      <g class="node" style="--c: var(--state)" transform="translate(540 906)">
        <rect width="260" height="84"></rect>
        <text class="zh" x="130" y="34">全局状态</text>
        <text class="en" x="130" y="58">Global State</text>
      </g>

      <path class="arrow archive" d="M 250 718 V 948 H 420" marker-end="url(#arrow-archive)"></path>
      <path class="arrow archive" d="M 670 990 V 1032 H 420" marker-end="url(#arrow-archive)"></path>
      <g class="node" style="--c: var(--archive)" transform="translate(420 1010)">
        <rect width="260" height="84"></rect>
        <text class="zh" x="130" y="34">原始存档</text>
        <text class="en" x="130" y="58">Archive</text>
      </g>

      <g transform="translate(95 790)">
        <rect class="note-box" width="310" height="116"></rect>
        <text class="zh" x="155" y="32">同时维护 Note</text>
        <text class="en" x="155" y="56">Working Notes</text>
        <text class="small" x="155" y="82">Completed / Pending / Next</text>
        <text class="small" x="155" y="102">已完成 / 待完成 / 下一步</text>
      </g>

      <line x1="80" y1="1138" x2="840" y2="1138" stroke="#ded8ca" stroke-width="2"></line>
      <text class="section-title" x="460" y="1180">二、窗口快满后的硬切 / Hard Cutover</text>

      <g class="node" style="--c: var(--cut)" transform="translate(55 1212)">
        <rect width="150" height="58"></rect>
        <text class="zh" x="75" y="24">Context 快满</text>
        <text class="en" x="75" y="44">Near Limit</text>
      </g>
      <path class="arrow cut" d="M 205 1241 H 260" marker-end="url(#arrow-cut)"></path>

      <g class="node" style="--c: var(--cut)" transform="translate(260 1212)">
        <rect width="140" height="58"></rect>
        <text class="zh" x="70" y="24">Checkpoint</text>
        <text class="en" x="70" y="44">保存检查点</text>
      </g>
      <path class="arrow cut" d="M 400 1241 H 455" marker-end="url(#arrow-cut)"></path>

      <g class="node" style="--c: var(--cut)" transform="translate(455 1212)">
        <rect width="130" height="58"></rect>
        <text class="zh" x="65" y="24">Hard Cut</text>
        <text class="en" x="65" y="44">硬切窗口</text>
      </g>
      <path class="arrow cut" d="M 585 1241 H 640" marker-end="url(#arrow-cut)"></path>

      <g class="node" style="--c: var(--cut)" transform="translate(640 1212)">
        <rect width="225" height="58"></rect>
        <text class="zh" x="112.5" y="24">New Context</text>
        <text class="en" x="112.5" y="44">加载 State + Note 继续</text>
      </g>
    </svg>
  </div>

  <div class="legend">
    <div style="--c: var(--agent)"><strong>Agent / LLM</strong>负责推理和工具调用。</div>
    <div style="--c: var(--state)"><strong>State</strong>保存下一步决策必须知道的事实。</div>
    <div style="--c: var(--patch)"><strong>State Patch</strong>只描述本轮发生的最小状态变化。</div>
    <div style="--c: var(--archive)"><strong>Archive</strong>保存原始证据，必要时回溯。</div>
    <div style="--c: var(--cut)"><strong>Hard Cutover</strong>旧窗口结束，新窗口加载检查点继续。</div>
  </div>
</div>
